# Stands in for "the user lands on any VM": requests alternate between the two proxies.
upstream builders {
    server vm1:8080;
    server vm2:8080;
}

server {
    listen 80;
    client_max_body_size 10m;

    location / {
        proxy_pass http://builders;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # publishing runs npm install and a build
        proxy_read_timeout 600s;
        # if one VM is down, use the other
        proxy_next_upstream error timeout http_502 http_503;
    }
}
